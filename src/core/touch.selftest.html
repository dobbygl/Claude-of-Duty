<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>TouchControls self-test</title>
    <!--
      Test harness for src/core/touch.js, in the spirit of src/physics/selftest.js.

      The on-screen controls cannot be checked by a screenshot, and booting the
      whole engine to poke them costs ~90 s of world generation for a module that
      only ever touches four fields on `Input`. This page mounts TouchControls
      against a stub input object so a driver can synthesise pointer streams and
      assert on the result in seconds.

      Open it on the dev server (`/src/core/touch.selftest.html`) and drive it
      through `window.__T__` (the controls) and `window.__I__` (the stub input),
      or point a playwright script at it. It is not part of the build — vite only
      treats index.html as an entry.
    -->
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; touch-action: none; background: #11161b; }
    </style>
  </head>
  <body>
    <script type="module">
      import { TouchControls } from '/src/core/touch.js';

      /** Exactly the four things TouchControls is allowed to write to. */
      const input = {
        _pendingDown: new Set(),
        _pendingUp: new Set(),
        _rawLook: { x: 0, y: 0 },
        stick: { moveX: 0, moveY: 0, lookX: 0, lookY: 0 },
      };

      const t = new TouchControls(input);
      t.attach();

      window.__T__ = t;
      window.__I__ = input;
      window.__READY__ = true;
    </script>
  </body>
</html>
